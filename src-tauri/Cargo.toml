[package]
name = "cssv-viewer"
version = "0.1.0"
description = "A desktop viewer for CSSV files"
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
notify-debouncer-mini = "0.7"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The webview's own print signal, to name the PDF after the file (linux.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
