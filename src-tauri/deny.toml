# cargo deny check: known vulnerabilities, licenses, and where crates come from.

[graph]
# The systems the viewer is built for (.github/workflows/build.yml).
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-apple-darwin", "aarch64-apple-darwin"]

[advisories]
# RustSec's advisories. An unmaintained crate deep in Tauri's tree is no
# vulnerability, so only those of our own dependencies count.
unmaintained = "workspace"

[licenses]
# Licenses that let the viewer, MIT itself, ship the crates inside it.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Tauri's tree has several versions of some crates, which isn't ours to fix.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
