# Builds the viewer for Linux (AppImage, .deb, .rpm), macOS and Windows, and
# attaches the files to a GitHub release for each v* tag. The tag is an
# annotated one whose message is the version, a blank line and the
# changelog; the changelog becomes the release's notes. The files are
# renamed without the version, so releases/latest/download/<name> always
# gives the newest (cssv.dev links there), and a tag with a hyphen
# (v0.2.0-rc.1) makes a pre-release, which that link skips.
name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only, but for the release job, which publishes the files.
permissions:
  contents: read

jobs:
  linux:
    # The oldest glibc the AppImage runs with is the one it's built against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with: { toolchain: stable }
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libxdo-dev libssl-dev file
      - run: npm ci
      - run: npx tauri build --bundles deb,rpm
      - run: npm run appimage -- --binary src-tauri/target/release/cssv-viewer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/CSSV-Viewer-x86_64.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with: { toolchain: stable, targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with: { toolchain: stable }
      - run: npm ci
      - run: npx tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: artifacts }
      - name: Release, with the tag's changelog as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "$TAG isn't an annotated tag, so it has no changelog" >&2
            exit 1
          fi
          # The message without its first line, the version, and the blank one after it.
          gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .message | tail -n +3 > notes.md
          # One fixed name for each kind of file.
          declare -A names=(
            [AppImage]=CSSV-Viewer-x86_64.AppImage
            [deb]=CSSV-Viewer-amd64.deb
            [rpm]=CSSV-Viewer-x86_64.rpm
            [dmg]=CSSV-Viewer-macOS.dmg
            [exe]=CSSV-Viewer-Windows-setup.exe
            [msi]=CSSV-Viewer-Windows.msi
          )
          mkdir release
          while IFS= read -r -d '' file; do
            name=${names[${file##*.}]:-}
            if [ -z "$name" ]; then
              echo "$file: not a kind of file a release has" >&2
              exit 1
            elif [ -e "release/$name" ]; then
              echo "$file: a second $name" >&2
              exit 1
            fi
            mv "$file" "release/$name"
          done < <(find artifacts -type f -print0)
          for name in "${names[@]}"; do
            if [ ! -e "release/$name" ]; then
              echo "The builds made no $name" >&2
              exit 1
            fi
          done
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag "${prerelease[@]}" release/*
