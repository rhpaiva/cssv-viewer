<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The window holds the Tauri API its tabs call (ipc:), and shows tabs (viewer.html) in frames. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ipc: http://ipc.localhost; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>CSSV Viewer</title>
  <link rel="stylesheet" href="viewer.css">
  <link rel="stylesheet" href="tabs.css">
  <script src="boot.js"></script>
  <script type="module" src="tabs.js"></script>
</head>
<body class="window">
  <nav class="strip" aria-label="Tabs">
    <div class="tabs" id="tabs" role="tablist" aria-label="Open files"></div>
    <button type="button" class="tb new-tab" id="new-tab" title="New tab (Ctrl+T)" aria-label="New tab (Ctrl+T)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
  </nav>
  <div class="frames" id="frames"></div>
  <div class="drop" id="drop" hidden><p>Drop to open</p></div>
  <div class="palette" id="palette">
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Commands and recent files">
      <input class="palette-input" id="palette-input" type="text" placeholder="Search commands and recent files" spellcheck="false" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
      <div class="palette-list" id="palette-list" role="listbox" aria-label="Commands and recent files"></div>
      <p class="palette-foot" aria-hidden="true"><kbd>↑</kbd> <kbd>↓</kbd> to choose, <kbd>Enter</kbd> to run, <kbd>Esc</kbd> to close</p>
    </div>
  </div>
</body>
</html>
